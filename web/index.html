<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Watch</title>
  </head>
  <body>
    <header class="top">
      <div>
        <h1>Job Watch</h1>
        <p id="subtitle" class="muted"></p>
      </div>
      <label class="picker">Run
        <select id="snapshot"></select>
      </label>
    </header>

    <nav class="tabs" role="tablist" aria-label="Watch list">
      <button type="button" role="tab" data-dataset="banks">Banks &amp; finance · Bolivia</button>
      <button type="button" role="tab" data-dataset="tech">Tech · LATAM remote</button>
    </nav>

    <main>
      <p id="error" class="alert error" hidden></p>
      <p id="runs" class="runs"></p>
      <section id="summary" class="cards" aria-label="Summary"></section>
      <section id="failed" class="alert warn" hidden></section>

      <section>
        <div class="filters">
          <input id="q" type="search" placeholder="Search all columns…" aria-label="Search" />
          <label class="check"><input id="only-new" type="checkbox" /> New only</label>
          <button id="clear" type="button" class="secondary">Clear filters</button>
          <span id="count" class="muted"></span>
        </div>
        <div class="table-wrap">
          <table id="jobs">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="changes"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
